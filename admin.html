:root{
  --bg:#080808;
  --surface:#131313;
  --surface-2:#1c1c1c;
  --surface-3:#242424;
  --line:#2b2b2b;
  --gold:#FFD700;
  --green:#00C853;
  --red:#ff4d4d;
  --text:#f6f2e6;
  --muted:#a9a49a;
  --gold-soft:#fff3a6;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#080808;
    --surface:#131313;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Archivo',system-ui,sans-serif;
}

button,input,select,textarea{
  font-family:inherit;
}

::-webkit-scrollbar{
  height:8px;
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:#3a3a3a;
  border-radius:99px;
}

.num{
  font-family:'Space Grotesk',monospace;
}

.gold-text{
  color:var(--gold);
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
}

.input{
  width:100%;
  background:#0d0d0d;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  outline:none;
  font-size:14px;
}

.input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,215,0,.14);
}

.label{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  margin-bottom:6px;
  display:block;
}

.btn{
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  padding:10px 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.15s;
  border:1px solid transparent;
  cursor:pointer;
}

.btn:active{
  transform:translateY(1px) scale(.99);
}

.btn-gold{
  background:var(--gold);
  color:#111;
}

.btn-green{
  background:var(--green);
  color:#fff;
}

.btn-dark{
  background:#222;
  color:#fff;
  border-color:#333;
}

.btn-red{
  background:#3a1515;
  color:#ff8a8a;
  border-color:#5a2222;
}

.btn-ghost{
  background:transparent;
  color:var(--muted);
  border-color:var(--line);
}

.chip{
  font-size:11px;
  font-weight:800;
  padding:5px 9px;
  border-radius:999px;
  white-space:nowrap;
}

.table th{
  text-align:left;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

.table td{
  padding:12px;
  border-bottom:1px solid #1e1e1e;
  font-size:13px;
  vertical-align:middle;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:12px;
  color:#cfcbc2;
  font-size:13px;
  font-weight:700;
  text-align:left;
}

.nav-item.active{
  background:var(--gold);
  color:#111;
}

.nav-item:hover:not(.active){
  background:#1e1e1e;
  color:#fff;
}
